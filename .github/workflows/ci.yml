name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fix rollup linux optional binary (match rollup version)
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rollup'].version")
          echo "Detected rollup version: $ROLLUP_VERSION"
          npm install --no-save @rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
